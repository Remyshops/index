:root{--paper:#F2F4F3;--ink:#15232B;--brand:#0F5C6E;--line:#D5DEE1;--muted:#5C6B73}

html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
.app{max-width:600px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}
header{padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:700}
header p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:84%;padding:9px 13px;border-radius:14px;line-height:1.9;white-space:pre-line;word-wrap:break-word;font-size:14.5px}
.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-top-right-radius:4px}
.user{background:var(--brand);color:#fff;align-self:flex-end;border-top-left-radius:4px}
.msg a{color:var(--brand);word-break:break-all}
.user a{color:#fff}
.cta{display:inline-block;background:var(--brand);color:#fff !important;padding:8px 14px;border-radius:10px;text-decoration:none;word-break:normal}
.typing{align-self:flex-start;color:var(--muted);font-size:15px;padding:0 10px;letter-spacing:2px}
.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink)}
.composer input:focus{border-color:var(--brand);background:#fff;outline:none}
.composer button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 20px;background:var(--brand);color:#fff;cursor:pointer}
.composer button:focus-visible,.cta:focus-visible{outline:3px solid #7FB7C4;outline-offset:2px}
.picker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;max-width:100%;align-self:stretch;scroll-snap-type:x proximity}
.pcard{flex:0 0 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:right;font:inherit;cursor:pointer;scroll-snap-align:start;color:var(--ink)}
.pcard:hover{border-color:var(--brand)}
.pcard:focus-visible{outline:3px solid #7FB7C4;outline-offset:2px}
.pimg{height:120px;border-radius:8px;background:#EEF3F4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain}
.pname{font-size:13px;font-weight:600;line-height:1.6;margin-top:6px}
.pprice{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-self:flex-start;padding:2px 0 6px}
.chip{font:inherit;font-weight:600;font-size:14px;background:#fff;color:var(--brand);border:1.5px solid var(--brand);border-radius:12px;padding:9px 20px;cursor:pointer}
.chip:hover{background:var(--brand);color:#fff}
.chip:focus-visible{outline:3px solid #7FB7C4;outline-offset:2px}
.oform{max-width:96%;align-self:flex-start;padding:10px 10px 12px}
.oform.done{opacity:.65}
.olist{max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.ogroup{position:sticky;top:0;z-index:1;font-size:12px;font-weight:600;color:var(--brand);background:#fff;padding:7px 10px 5px;border-bottom:1px solid var(--line)}
.orow{background:#fff;padding:8px 10px;border-bottom:1px solid var(--line)}
.otop{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;line-height:1.7}
.otop input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin:0;accent-color:var(--brand);cursor:pointer}
.oname{flex:1;font-weight:600}
.oprice{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.oqty{display:flex;align-items:center;gap:8px;padding-inline-start:26px;margin-top:6px;font-size:12.5px}
.oqty[hidden]{display:none}
.oqty input{width:76px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.oqty select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.ofoot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ocount{flex:1;font-size:12.5px;color:var(--muted);min-width:120px}
.obtn{font:inherit;font-weight:600;font-size:13.5px;border:1.5px solid var(--brand);border-radius:10px;padding:7px 16px;background:var(--brand);color:#fff;cursor:pointer}
.obtn.ghost{background:#fff;color:var(--brand)}
.obtn:disabled{opacity:.45;cursor:default}
.oerr{min-height:0;color:#B3261E;font-size:12.5px;margin-top:6px}
.oform button:focus-visible,.oform input:focus-visible,.oform select:focus-visible{outline:3px solid #7FB7C4;outline-offset:2px}
</style>
</head>

function linkify(el, text) {
  text.split(/(https?:\/\/\S+)/).forEach(p => {
    if (/^https?:\/\//.test(p)) {
      const a = document.createElement('a');
      a.href = p; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p;
      el.appendChild(a);
    } else if (p) {
      el.appendChild(document.createTextNode(p));
    }
  });
}

      d.className = 'msg bot';
      const b = document.createElement('a');
      b.className = 'cta'; b.href = '#';

/* کارت‌های عکس‌دار: مشتری با لمس عکس انتخاب می‌کند */
function addPicker(items, onPick) {
  const row = document.createElement('div');
  row.className = 'picker';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pcard';
    const box = document.createElement('div');
    box.className = 'pimg';
    if (it.img) {
      const im = document.createElement('img');
      im.src = CONFIG.IMG_BASE + it.img;
      im.alt = it.name;
      im.loading = 'lazy';
      im.addEventListener('error', () => { im.remove(); box.classList.add('noimg'); });
      box.appendChild(im);
    }
    const nm = document.createElement('div'); nm.className = 'pname'; nm.textContent = it.name;
    const pr = document.createElement('div'); pr.className = 'pprice'; pr.textContent = it.price || '';
    b.appendChild(box); b.appendChild(nm); b.appendChild(pr);
    b.addEventListener('click', () => {
      row.remove();
      addUser(it.name);
      busy = busy.then(() => onPick(it));
    });
    row.appendChild(b);
  });
  chat.appendChild(row);
  scrollDown();
}

/* دکمه‌های انتخاب سریع (مثلاً باسلام / واتساپ) */
function addChoices(items, onPick) {
  const row = document.createElement('div');
  row.className = 'chips';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = it.label;
    b.addEventListener('click', () => {
      row.remove();
      addUser(it.label);
      busy = busy.then(() => onPick(it.key));
    });
    row.appendChild(b);
  });
  chat.appendChild(row);
  scrollDown();
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.textContent = '…';
  chat.appendChild(t);
  scrollDown();
  return t;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/* صف پیام‌ها: هر پیام بات بعد از تایپ کوتاه نشان داده می‌شود تا مثل گفتگوی واقعی باشد */
let busy = Promise.resolve();

async function play(parts) {
  for (const p of parts) {
    const part = typeof p === 'string' ? { text: p } : p;
    const t = addTyping();
    await wait(Math.min(500, 150 + (part.text || '').length * 5));
    t.remove();
    addBot(part);
  }
}

function say(...parts) { parts = parts.filter(Boolean); busy = busy.then(() => play(parts)); }
function respond(text) { busy = busy.then(() => handle(text)); }

  let best = 0, res = [];

    const sc = ks.reduce((a, k) => a + k.length, 0);
    if (sc > best) { best = sc; res = [it]; }
    else if (sc > 0 && sc === best) res.push(it);
  });
  return res;
}

    need: M ? M.need : '',
    kind: kind || '',
    biz: S.biz ? BIZ_LABEL[S.biz] : 'نامشخص',
    buy: M ? M.buy : S.qty ? (S.qty.unit === 'کارتن' ? 'عمده' : 'خرده') : 'نامشخص'
  };

const LEAD_CHOICES = [
  { key: 'ok', label: 'تأیید و ارسال' },
  { key: 'name', label: 'ویرایش نام' },
  { key: 'postal', label: 'ویرایش کدپستی' },
  { key: 'address', label: 'ویرایش آدرس' },
  { key: 'need', label: 'ویرایش محصول' },
  { key: 'qty', label: 'ویرایش تعداد' }
];

function leadLines(L) {
  return [
    'نام: ' + L.name,
    'نوع کسب‌وکار: ' + L.biz,
    'کدپستی: ' + L.postal,
    'آدرس: ' + L.address,
    'محصول/نیاز: ' + L.need,
    'حجم تقریبی: ' + (L.qty || 'نامشخص')
  ];
}

/* مرحله‌ی تأیید: مشتری اطلاعاتی که فرستاده می‌شه رو می‌بینه و هر کدوم رو می‌تونه عوض کنه */
function confirmLead() {
  S.step = 'confirm';
  const L = S.lead;
  say({
    text: 'این اطلاعاته که برای همکارم می‌فرستم:\n' + leadLines(L).join('\n') + '\nاگه درسته تأیید کن؛ اگه چیزی عوض داره، از دکمه‌ها انتخاب کن.',
    choices: LEAD_CHOICES,
    onChoice: leadEditPick
  });
}

function leadEditPick(key) {
  if (key === 'ok') { S.step = null; return finish(); }
  const prompts = {
    name: 'نام و نام خانوادگی جدید رو بنویس:',
    postal: 'کدپستی جدید رو بنویس (۱۰ رقم):',
    address: 'آدرس کامل جدید رو بنویس (شهر، خیابان، کوچه و پلاک):',
    need: 'محصول یا سفارش رو دوباره بنویس:',
    qty: 'تعداد تقریبی رو بنویس (مثلاً ۲ کارتن یا ۵ عدد):'
  };
  S.step = 'edit_' + key;
  say(prompts[key]);
}

function leadStep(text) {
  const L = S.lead;
  const t = text.trim();
  const skip = SKIP_RX.test(norm(text));

  if (S.step === 'confirm') {
    if (/تایید|تأیید|تاییدمیکنم|درسته|اوکی|بله|آره|ارسال|حتما/.test(norm(text))) { S.step = null; return finish(); }
    return say({ text: 'اگه درسته «تأیید و ارسال» رو بزن؛ اگه چیزی عوض داره، از دکمه‌های زیر انتخاب کن.', choices: LEAD_CHOICES, onChoice: leadEditPick });
  }

  if (S.step === 'edit_name') {
    const words = t.split(/\s+/).filter(Boolean);
    if (words.length < 2 && !L.editNameAsked) {
      L.editNameAsked = true;
      return say('نام خانوادگی‌ت رو هم بنویس، لطفاً.');
    }
    L.name = t.slice(0, 80);
    return confirmLead();
  }
  if (S.step === 'edit_postal') {
    const digits = toLatinDigits(text).replace(/[\s\-]/g, '');
    if (/^\d{10}$/.test(digits)) L.postal = digits;
    else if (skip) L.postal = 'نامشخص';
    else return say('کدپستی باید ۱۰ رقم باشه. اگه الان نداری، بنویس «ندارم».');
    return confirmLead();
  }
  if (S.step === 'edit_address') {
    if (!skip && t.length < 8) return say('آدرس خیلی کوتاهه. لطفاً شهر، خیابان و پلاک رو کامل بنویس.');
    L.address = skip ? 'نامشخص' : t.slice(0, 300);
    return confirmLead();
  }
  if (S.step === 'edit_need') {
    L.need = t.slice(0, 300);
    const ff = matchItems(norm(text));
    if (ff.length === 1 && L.kind !== 'complaint') L.ctx = ff[0].name;
    return confirmLead();
  }
  if (S.step === 'edit_qty') {
    L.qty = t.slice(0, 100);
    if (/کارتن|کارتون/.test(t)) L.buy = 'عمده';
    else if (/عدد|دونه/.test(t)) L.buy = 'خرده';
    return confirmLead();
  }

  if (S.step === 'name') {
    const words = t.split(/\s+/).filter(Boolean);
    if (words.length < 2 && !L.nameAsked) {
      L.nameAsked = true;
      return say('فقط اسمت رو نوشتی. نام خانوادگی\u200cت رو هم بنویس، لطفاً.');
    }
    L.name = t.slice(0, 80);
    S.step = 'postal';
    return say('ممنون ' + L.name + '. کدپستی\u200cت رو بنویس (۱۰ رقم).');
  }
  if (S.step === 'postal') {
    const digits = toLatinDigits(text).replace(/[\s\-]/g, '');
    if (/^\d{10}$/.test(digits)) L.postal = digits;
    else if (skip) L.postal = 'نامشخص';
    else return say('کدپستی باید ۱۰ رقم باشه. اگه الان نداری، بنویس «ندارم».');
    S.step = 'address';
    return say('آدرس کامل\u200cت رو بنویس (شهر، خیابان، کوچه و پلاک).');
  }
  if (S.step === 'address') {
    if (!skip && t.length < 8 && !L.addrTries) {
      L.addrTries = 1;
      return say('آدرس خیلی کوتاهه. لطفاً شهر، خیابان و پلاک رو کامل بنویس.');
    }
    L.address = skip ? 'نامشخص' : t.slice(0, 300);
    if (L.qty && (S.product || L.need) && !L.kind) {
      if (!L.need) L.need = S.product.name + '، ' + L.qty;
      return confirmLead();
    }
    S.step = 'need';
    return say(L.kind === 'complaint' ? 'مشکل یا نارضایتی\u200cت رو کوتاه بنویس.' : 'چی می\u200cخوای سفارش بدی و تقریباً چه تعدادی؟');
  }
  if (S.step === 'need') {
    L.need = t.slice(0, 300);
    const qq = parseQty(norm(text)) || parseQtyWords(text);
    if (qq && !L.qty) { L.qty = fa(qq.n) + ' ' + qq.unit; L.buy = qq.unit === 'کارتن' ? 'عمده' : 'خرده'; }
    const ff = matchItems(norm(text));
    if (ff.length === 1 && L.kind !== 'complaint') L.ctx = ff[0].name;
    return confirmLead();
  }
}

function finish() {
  S.multi = null;
  const L = S.lead;
  const status = L.kind === 'complaint' ? 'نیاز به پیگیری انسانی (شکایت)' : 'نیاز به پیگیری انسانی';
  const summary = 'سلام، از گفتگوی سایت پخش نانو جی‌پلاس:\n' + leadLines(L).join('\n') + '\nخرید: ' + L.buy + '\nکانال: واتساپ\nوضعیت: ' + status + '\nیادداشت: ' + L.ctx;
  let saved = '';
  if (CONFIG.LEAD_WEBHOOK) { sendLead(L); saved = ' نسخه‌ای از درخواستت هم ثبت شد.'; }
  const wa = 'https://wa.me/' + CONFIG.WHATSAPP + '?text=' + encodeURIComponent(summary);
  say('ممنون ' + L.name + '، درخواستت آماده‌ست.' + saved,
    { text: 'با دکمه‌ی زیر، همین پیام رو از واتساپ برای همکارم بفرست تا پیگیری کنه. ' + HOURS_TEXT, link: { label: 'ارسال در واتساپ', href: wa } });
}

function sendLead(L) {
  try {
    fetch(CONFIG.LEAD_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: L.name, postal_code: L.postal, address: L.address, need: L.need, context: L.ctx, business: L.biz, qty: L.qty, purchase: L.buy, channel: 'whatsapp', source: 'website-chat', time: new Date().toISOString() })
    });
  } catch (e) { /* ثبت نباید گفتگو را متوقف کند */ }
}

const ORDER_GROUPS = [

];
const SKIP_RX = /نمیدونم|ندونم|ندارم|بلدنیستم/;
const toLatinDigits = s => String(s)
  .replace(/[۰-۹]/g, c => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c)))
  .replace(/[٠-٩]/g, c => String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)));

/* دستمال و گالن فقط حجمی‌اند؛ توی منو هم هستن و قیمتشون رو همکارم اعلام می‌کنه */
const MENU_EXTRA = [
  ...TISSUE.map(t => ({ id: t.id, short: t.name, name: t.name, bulkOnly: true, units: ['کارتن'], priceText: money(t.bulk) + ' هر عدد (حجمی)' })),
  ...GALLON.map(g => ({ id: g.id, short: g.name, name: g.name, bulkOnly: true, units: ['گالن'], priceText: money(g.bulk) + ' هر گالن (حجمی)' }))
];
const MENU_BY_ID = Object.fromEntries([...ITEMS, ...MENU_EXTRA].map(x => [x.id, x]));
const menuPrice = it => it.priceText || priceLabel(it);
const menuUnits = it => it.units || (it.buy ? ['عدد', 'کارتن'] : ['عدد']);

/* گروه‌های منو: اول پیشنهاد کسب‌وکار، بعد پرفروش‌ها، بعد دسته‌ها، آخر حجمی‌ها */
function orderGroups() {
  const rec = S.biz && REC[S.biz] ? REC[S.biz].ids.filter(id => MENU_BY_ID[id]) : [];
  const best = BEST_IDS.filter(id => rec.indexOf(id) === -1);
  const used = rec.concat(best);
  const groups = [];
  if (rec.length) groups.push({ label: 'پیشنهادی برای کسب‌وکار شما', ids: rec });
  groups.push({ label: 'پرفروش‌ها', ids: best });
  ORDER_GROUPS.forEach(g => {
    const ids = ITEMS.filter(it => it.id.indexOf(g.key) === 0 && used.indexOf(it.id) === -1).map(it => it.id);
    if (ids.length) groups.push({ label: g.label, ids: ids });
  });
  groups.push({ label: 'دستمال نانو (فقط حجمی)', ids: TISSUE.map(t => t.id) });
  groups.push({ label: 'گالن ۲۰ لیتری (فقط حجمی)', ids: GALLON.map(g => g.id) });
  return groups;
}

/* تنها راه سفارش: منوی تیک‌دار. found: محصول‌های از قبل مشخص (آرایه‌ای از {id}) */
function orderMenu(found, n, preset, intro) {
  S.multi = null;
  S.ask = null;
  const pre = found === undefined ? (S.product ? [S.product.id] : []) : found.map(x => x.id);
  if (n) ITEMS.forEach(it => {
    if (pre.indexOf(it.id) === -1 && it.kw.some(k => { const kk = norm(k); return kk.length >= 2 && n.indexOf(kk) !== -1; })) pre.push(it.id);
  });
  (preset || []).forEach(p => { if (pre.indexOf(p.id) === -1) pre.push(p.id); });
  say({
    text: intro || 'هر چی لازم داری تیک بزن، تعدادش رو بنویس و بعد «ادامه» رو بزن.',
    orderForm: { groups: orderGroups(), pre: pre, preset: preset || [] }
  });
}

function addOrderForm(cfg) {
  // منوی قبلی که هنوز باز است را غیرفعال می‌کنیم تا دو سفارش همزمان نساخته شود
  chat.querySelectorAll('.oform:not(.done)').forEach(f => {
    f.classList.add('done');
    f.querySelectorAll('input, select, button').forEach(e => { e.disabled = true; });
  });
  const presetOf = {};
  cfg.preset.forEach(p => { presetOf[p.id] = p; });

  const box = document.createElement('div');
  box.className = 'msg bot oform';
  const list = document.createElement('div');
  list.className = 'olist';
  const rows = [];

  cfg.groups.forEach(g => {
    const head = document.createElement('div');
    head.className = 'ogroup';
    head.textContent = g.label;
    list.appendChild(head);
    g.ids.forEach(id => {
      const it = MENU_BY_ID[id];
      if (!it) return;
      const pv = presetOf[id];
      const row = document.createElement('div');
      row.className = 'orow';
      const top = document.createElement('label');
      top.className = 'otop';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = cfg.pre.indexOf(id) !== -1 || !!pv;
      const nm = document.createElement('span');
      nm.className = 'oname';
      nm.textContent = it.short || it.name;
      const pr = document.createElement('span');
      pr.className = 'oprice';
      pr.textContent = menuPrice(it);
      top.append(cb, nm, pr);
      const ctl = document.createElement('div');
      ctl.className = 'oqty';
      ctl.hidden = !cb.checked;
      const num = document.createElement('input');
      num.type = 'text';
      num.inputMode = 'numeric';
      num.value = pv ? String(pv.n) : '1';
      num.setAttribute('aria-label', 'تعداد');
      const unit = document.createElement('select');
      unit.setAttribute('aria-label', 'واحد');
      const units = menuUnits(it);
      units.forEach(u => unit.add(new Option(u, u)));
      if (pv && units.indexOf(pv.unit) !== -1) unit.value = pv.unit;
      ctl.append(num, unit);
      row.append(top, ctl);
      list.appendChild(row);
      rows.push({ it: it, cb: cb, num: num, unit: unit, ctl: ctl });
    });
  });

  const err = document.createElement('div');
  err.className = 'oerr';
  const foot = document.createElement('div');
  foot.className = 'ofoot';
  const count = document.createElement('span');
  count.className = 'ocount';
  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.className = 'obtn ghost';
  cancel.textContent = 'انصراف';
  const ok = document.createElement('button');
  ok.type = 'button';
  ok.className = 'obtn';
  ok.textContent = 'ادامه';
  foot.append(count, cancel, ok);
  box.append(list, err, foot);
  chat.appendChild(box);

  const refresh = () => {
    const n = rows.filter(r => r.cb.checked).length;
    count.textContent = n ? fa(n) + ' محصول انتخاب شده' : 'هنوز چیزی انتخاب نشده';
    ok.disabled = n === 0;
  };
  rows.forEach(r => r.cb.addEventListener('change', () => {
    r.ctl.hidden = !r.cb.checked;
    err.textContent = '';
    refresh();
  }));
  refresh();
  scrollDown();

  cancel.addEventListener('click', () => {
    box.remove();
    S.multi = null;
    say('باشه، هر وقت خواستی دوباره بگو.');
  });

  ok.addEventListener('click', () => {
    const picked = rows.filter(r => r.cb.checked);
    if (!picked.length) { err.textContent = 'حداقل یک محصول رو تیک بزن.'; return; }
    const badQty = picked.some(r => { const v = Number(toLatinDigits(r.num.value).trim()); return !Number.isInteger(v) || v < 1; });
    if (badQty) { err.textContent = 'تعداد هر محصول باید عدد کامل و حداقل ۱ باشه.'; return; }
    const order = picked.map(r => ({ it: r.it, n: Number(toLatinDigits(r.num.value).trim()), unit: r.unit.value }));
    box.classList.add('done');
    box.querySelectorAll('input, select, button').forEach(e => { e.disabled = true; });
    addUser(order.map(x => (x.it.short || x.it.name) + ' (' + fa(x.n) + ' ' + x.unit + ')').join('، '));
    busy = busy.then(() => multiSubmit(order));
  });
}

function multiSubmit(order) {
  S.product = null;
  S.qty = null;
  S.multi = order;
  let total = 0;
  const isBulk = x => x.it.bulkOnly || x.unit === 'گالن' || (x.unit === 'کارتن' && x.n >= CONFIG.BULK_MIN);
  const bulk = order.filter(isBulk);
  const lines = [];
  order.forEach(x => {
    const it = x.it;
    if (isBulk(x)) { lines.push('• ' + it.short + ': ' + fa(x.n) + ' ' + x.unit + ' (حجمی، قیمتش رو همکارم اعلام می‌کنه)'); return; }
    if (x.unit === 'کارتن') {
      const pcs = x.n * it.carton;
      const sum = pcs * it.buy;
      total += sum;
      lines.push('• ' + it.short + ': ' + fa(x.n) + ' کارتن (' + fa(pcs) + ' عدد)، تقریباً ' + money(sum) + ' عمده');
      return;
    }
    const sum = x.n * it.retail;
    total += sum;
    lines.push('• ' + it.short + ': ' + fa(x.n) + ' عدد، تقریباً ' + money(sum) + ' خرده');
    if (it.buy) lines.push('   ↳ اگه کارتنی (' + fa(it.carton) + ' عدد) برداری، هر عدد ' + money(it.buy) + ' درمیاد، به‌جای ' + money(it.retail));
  });
  const summary = 'سفارشت این شد:\n' + lines.join('\n') + (bulk.length ? '' : '\nجمع تقریبی: ' + money(total));
  if (bulk.length) {
    S.ask = 'handoff';
    return say(summary, 'بعضی از محصولات حجمی‌ان و قیمتشون رو همکارم دقیق اعلام می‌کنه. اگه بخوای همین الان ثبتش کنم تا پیگیری بشه؟');
  }
  S.ask = 'order';
  say(summary, channelAsk());
}

function multiSummary() {
  const M = S.multi;
  const kind = x => (x.it.bulkOnly || x.unit !== 'عدد') ? 'عمده' : 'خرده';
  const kinds = [...new Set(M.map(kind))];
  return {
    names: M.map(x => x.it.short).join('، '),
    need: M.map(x => x.it.short + ': ' + fa(x.n) + ' ' + x.unit).join('، '),
    qty: M.map(x => fa(x.n) + ' ' + x.unit).join('، '),
    buy: kinds.length > 1 ? 'خرده و عمده' : kinds[0]
  };
}

/* افزودن محصول بیشتر: منوی قبلی با همان تیک‌ها و تعدادها دوباره باز می‌شه */
function addMoreToOrder() {
  const cur = S.multi || [];
  S.ask = null;
  orderMenu(cur.map(x => ({ id: x.it.id })), undefined, cur.map(x => ({ id: x.it.id, n: x.n, unit: x.unit })), 'محصولات قبلی‌ت تیک خوردن. هر چی دیگه لازم داری اضافه کن، بعد «ادامه» رو بزن.');
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  addUser(t);
  respond(t);
});

say('سلام! من مشاور فروش پخش نانو جی‌پلاس هستم.', startChoices('کسب‌وکارت چیه، یا دنبال کدوم محصول هستی؟ 🟢'));
</script>
